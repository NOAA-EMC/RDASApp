time window:
       begin: 2024-05-26T21:00:00Z
       length: PT6H
increment variables: [eastward_wind,northward_wind,air_temperature,water_vapor_mixing_ratio_wrt_moist_air,cloud_liquid_ice,cloud_liquid_water,ozone_mass_mixing_ratio,air_pressure_at_surface]
geometry:
  fms initialization:
    namelist filename: DataFix/fmsmpp.nml
    field table filename: DataFix/field_table
  namelist filename: DataFix/input_lam_C775_NP16X10.nml
  akbk: DataFix/fix/akbk66.nc
  # input.nml
  npz: 65
  layout: [16,10]
  io_layout: [1,1]
  ntiles: 1
  fieldsets:
    - fieldset: DataFix/fix/dynamics_lam_cmaq.yaml


background:
  datetime: &analysisDate 2024-05-27T00:00:00Z
  filetype: fms restart
  members from template:
      template:
        datetime: 2024-05-27T00:00:00Z
        filetype: fms restart
        state variables:
          - eastward_wind
          - northward_wind
          - air_temperature
          - air_pressure_thickness
          - water_vapor_mixing_ratio_wrt_moist_air
          - cloud_liquid_ice
          - cloud_liquid_water
          - ozone_mass_mixing_ratio
          - geopotential_height_times_gravity_at_surface
          - f10m
          - slmsk
          - sheleg
          - skin_temperature_at_surface
          - vtype
          - stype
          - vfrac
          - soilt
          - soilm
          - eastward_wind_at_surface
          - northward_wind_at_surface
          - air_pressure_at_surface
        field io names: &io_names
          eastward_wind: ua
          northward_wind: va
          air_temperature: T
          air_pressure_thickness: DELP
          water_vapor_mixing_ratio_wrt_moist_air: sphum
          cloud_liquid_ice: ice_wat
          cloud_liquid_water: liq_wat
          ozone_mass_mixing_ratio: o3mr
          geopotential_height_times_gravity_at_surface: phis
          skin_temperature_at_surface: tsfc
          soilt: tslb
          soilm: smois
          eastward_wind_at_surface: u_srf
          northward_wind_at_surface: v_srf
        datapath: data/inputs/mem%mem%/
        filename_core: 20240527.000000.fv_core.res.tile1.nc
        filename_trcr: 20240527.000000.fv_tracer.res.tile1.nc
        filename_sfcd: 20240527.000000.sfc_data.nc
        filename_sfcw: 20240527.000000.fv_srf_wnd.res.tile1.nc
        filename_cplr: 20240527.000000.coupler.res
      pattern: "%mem%"
      nmembers: 30
      zero padding: 3

observations:
     observers:
        "@OBSERVATIONS@"

driver:
  run as observer only: true
  update obs config with geometry info: false

local ensemble DA:
  solver: Deterministic GETKF
  use linear observer: true
  vertical localization: # current settings use 12 modulated members
    fraction of retained variance: 0.850
    lengthscale: 0.50
    lengthscale units: logp
  inflation:
    rtps: 0.95

output mean prior:
  filetype: fms restart
  datapath: ./
  prefix: letkf-meanprior-fv3_lam-C775

output: # for outputting mean posterior
  filetype: fms restart
  datapath: ./
  prefix: letkf-meanposterior-fv3_lam-C775

test:
  reference filename: testoutput/rrfs-fv3jedi-getkf-observer.ref
  test output filename: ./rrfs-fv3jedi-getkf-observer.out
  float relative tolerance: 0.02
  float absolute tolerance: 1.0e-6
  integer tolerance: 3
