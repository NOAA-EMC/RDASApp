  observers:
  - obs space:
      name: aircar_airTemperature_133
      obsdatain:
        engine:
          type: H5File
          obsfile: ../rundir-rrfs_ijedi_2024052700_getkf_observer/jdiag_aircar_airTemperature_133.nc
          missing file action: warn
        obsgrouping:
          group variables:
          - stationIdentification
          sort variable: pressure
          sort order: descending
      obsdataout:
        empty obs space action: create output
        write multiple files: false
        engine:
          type: H5File
          obsfile: jdiag_aircar_airTemperature_133.nc
          allow overwrite: true
      io pool:
        max pool size: 1
      observed variables:
      - airTemperature
      simulated variables:
      - airTemperature
      distribution:
        name: Halo
        halo size: 500e3
    obs operator:
      name: VertInterp
      vertical coordinate: air_pressure
      observation vertical coordinate: pressure
      observation vertical coordinate group: MetaData
      interpolation method: log-linear
      variables:
      - name: airTemperature
    linear obs operator:
      name: VertInterp
    obs filters:
    - filter: Perform Action
      udescriptor: iuse_check
      filter variables:
      - name: airTemperature
      where:
      - variable: ObsType/airTemperature
        is_in: 133
      action:
        name: accept
    - filter: Perform Action
      udescriptor: obs_type_check
      where:
      - variable: ObsValue/airTemperature
        value: is_not_valid
      action:
        name: reduce obs space
    - filter: Perform Action
      udescriptor: obs_kx_check
      where:
      - variable: ObsType/airTemperature
        is_not_in: 133
      action:
        name: reduce obs space
    - filter: RejectList
      udescriptor: quality_marker_check
      filter variables:
      - name: airTemperature
      where:
      - variable: QualityMarker/airTemperature
        is_in: 4-15
        value: is_not_valid
      where operator: or
      action:
        name: reduce obs space
    - filter: Bounds Check
      udescriptor: time_window_check
      filter variables:
      - name: airTemperature
      test variables:
      - name: MetaData/timeOffset
      minvalue: -2700
      maxvalue: 2700
      where:
      - variable: ObsType/airTemperature
        is_in: 133
      action:
        name: reduce obs space
    - filter: DuplicateThinning
      udescriptor: duplicate_check
      filter variables:
      - name: airTemperature
      analysis_time: '2024-05-27T00:00:00Z'
      analysis_time_tolerance: PT0S
      min_spacing: PT90M
      equidistant_time_selection: after
      variable names:
      - MetaData/longitude
      - MetaData/latitude
      - MetaData/pressure
      tolerance:
      - 1.0e-06
      - 1.0e-06
      - 1.0e-06
      where:
      - variable: ObsType/airTemperature
        is_in: 133
      action:
        name: reduce obs space
    - filter: Perform Action
      udescriptor: initial_error_assignment
      filter variables:
      - name: airTemperature
      where:
      - variable: ObsType/airTemperature
        is_in: 133
      action:
        name: assign error
