  akbk: fv3_akbk
  npz: 65
  layout:
  - 16
  - 10
  io_layout:
  - 1
  - 1
  ntiles: 1
time window:
  begin: '2024-05-26T21:00:00Z'
  length: PT6H
  bound to include: begin
increment variables:
- eastward_wind
- northward_wind
- air_temperature
- air_pressure_thickness
- water_vapor_mixing_ratio_wrt_moist_air
- cloud_liquid_ice
- cloud_liquid_water
- ozone_mass_mixing_ratio
background:
