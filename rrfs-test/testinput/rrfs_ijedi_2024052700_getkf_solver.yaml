        skin_temperature_at_surface_where_land:
        - SkinTemperatureAtSurfaceWhereLand_A
        skin_temperature_at_surface_where_sea:
        - SkinTemperatureAtSurfaceWhereSea_A
        skin_temperature_at_surface_where_snow:
        - SkinTemperatureAtSurfaceWhereSnow_A
        soil_temperature:
