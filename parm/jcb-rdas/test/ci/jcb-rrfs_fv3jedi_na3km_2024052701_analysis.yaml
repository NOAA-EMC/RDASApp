# This is overwritten in the testing but allows command line test of jcb
algorithm: 3dvar

# Search path for model and obs for JCB (relative for the submodule, or can be absolute)
# --------------------------------------------------------------------------------------
app_path_algorithm: rdas/algorithm/atmosphere
app_path_model: rdas/model/fv3/atmosphere
app_path_observations: rdas/observations/atmosphere
app_path_observation_chronicle: rdas/observation_chronicle/atmosphere


# Places where we deviate from the generic file name of a yaml
# ------------------------------------------------------------
# Write increments (inc_jedi.*) and leave the backgrounds untouched (no output_file)
final_increment_file: atmosphere_final_increment
model_file: atmosphere_model_pseudo
initial_condition_file: atmosphere_background
# Hybrid 3DEnVar: GSI static B plus the 6 km ensemble with MGBF localization
background_error_file: atmosphere_background_error_hybrid3denvar_mgbf_rotlonlat
vader_custom_cookbook_file: atmosphere_vader_custom_cookbook

# Global analysis things
# ----------------------
window_length: PT6H
bound_to_include: begin
minimizer: DRPCG
final_diagnostics_departures: oman
final_j_evaluation: true
number_of_outer_loops: 1
ninner: 50
gradient_norm_reduction: 1e-3
distribution: RoundRobin
empty_obs_space_action: create output

# Reflectivity and hydrometeors first: the MGBF variable groups follow this order
analysis_variables:
- equivalent_reflectivity_factor
- cloud_liquid_water
- cloud_liquid_ice
- rain_water
- snow_water
- graupel
- eastward_wind
- northward_wind
- air_temperature
- water_vapor_mixing_ratio_wrt_moist_air
- air_pressure_at_surface

control_variables:
- eastward_wind
- northward_wind
- air_temperature
- water_vapor_mixing_ratio_wrt_moist_air
- air_pressure_at_surface
- cloud_liquid_water
- cloud_liquid_ice
- rain_water
- snow_water
- graupel
- equivalent_reflectivity_factor

state_variables_to_inverse:
- eastward_wind
- northward_wind
- air_temperature
- water_vapor_mixing_ratio_wrt_moist_air
- ozone_mass_mixing_ratio
- geopotential_at_surface
- air_pressure_thickness
- air_pressure_at_surface
- cloud_liquid_ice
- cloud_liquid_water
- rain_water
- snow_water
- graupel
- equivalent_reflectivity_factor

# Testing
# -------
do_testing: true
test_reference_filename: testoutput/rrfs-fv3jedi-na3km-2024052701-analysis.ref
test_output_filename: rrfs-fv3jedi-na3km-2024052701-analysis.out
test_float_relative_tolerance: 0.02
test_float_absolute_tolerance: 1.0e-6
test_integer_tolerance: 3

# Model things
# ------------
# Dual resolution: 3 km background and outer loop, 6 km inner loop and ensemble
fv3lam_nml: INPUT/input_lam_C3463_NP44X44.nml
fv3lam_nml_inner: INPUT/input_lam_C1732_NP44X44.nml
# Members are read on the 3 km grid and converted online to the 6 km grid (oops PR3346)
ensemble_fv3lam_nml: INPUT/input_lam_C3463_NP44X44.nml
atmosphere_layout_x: 44
atmosphere_layout_y: 44
atmosphere_npx_ges: 3950
atmosphere_npy_ges: 2700
atmosphere_npz_ges: 65
atmosphere_npx_anl: 1975
atmosphere_npy_anl: 1350
atmosphere_npz_anl: 65
atmosphere_ntiles: 1
atmosphere_io_layout_x: 1
atmosphere_io_layout_y: 1

# Background
atmosphere_background_path: "./"
atmosphere_background_ensemble_path: "data/inputs/mem%mem%"

atmosphere_background_time_iso: '2024-05-27T01:00:00Z'
atmosphere_background_time_prefix: ""
filename_core: fv_core.res.tile1.nc
filename_trcr: fv_tracer.res.tile1.nc
# ref_f3d only, flipped top-down and floored at 0 dBZ by the stage script
filename_phys: phy_data.nc_prepdbz
filename_sfcd: sfc_data.nc
filename_sfcw: fv_srf_wnd.res.tile1.nc
filename_cplr: coupler.res

state_variables:
- eastward_wind
- northward_wind
- air_temperature
- air_pressure_thickness
- water_vapor_mixing_ratio_wrt_moist_air
- cloud_liquid_ice
- cloud_liquid_water
- ozone_mass_mixing_ratio
- geopotential_at_surface
- ratio_of_wind_at_surface_adjacent_layer_to_wind_at_10m
- slmsk
- sheleg
- skin_temperature_at_surface
- vtype
- stype
- vfrac
- tslb
- smois
- air_pressure_at_surface
- rain_water
- snow_water
- graupel
- cloud_droplet_number_concentration
- cloud_ice_number_concentration
- rain_number_concentration
- upward_air_velocity
- air_temperature_at_2m
- water_vapor_mixing_ratio_wrt_moist_air_at_2m
- eastward_wind_at_surface
- northward_wind_at_surface
- equivalent_reflectivity_factor

eastward_wind: ua
northward_wind: va
air_temperature: T
air_pressure_thickness: delp
air_pressure_at_surface: ps
water_vapor_mixing_ratio_wrt_moist_air: sphum
cloud_liquid_ice: ice_wat
cloud_liquid_water: liq_wat
ozone_mass_mixing_ratio: o3mr
geopotential_at_surface: phis
skin_temperature_at_surface: tsfc
tslb: tslb
smois: smois
rain_water: rainwat
snow_water: snowwat
graupel: graupel
cloud_droplet_number_concentration: water_nc
cloud_ice_number_concentration: ice_nc
rain_number_concentration: rain_nc
upward_air_velocity: W
equivalent_reflectivity_factor: ref_f3d
air_temperature_at_2m: t2m
water_vapor_mixing_ratio_wrt_moist_air_at_2m: q2m
eastward_wind_at_surface: u_srf
northward_wind_at_surface: v_srf
ratio_of_wind_at_surface_adjacent_layer_to_wind_at_10m: f10m

# Background error
atmosphere_number_ensemble_members: 30
atmosphere_layout_gsib_x: 44
atmosphere_layout_gsib_y: 44
gsibec_lats: 1351
gsibec_lons: 1976
lat_start: -36.4147012390921
lat_end: 36.4147012390921
lon_start: -59.7587096910596
lon_end: 59.7587096910596
north_pole_lat: 34.9999966097
north_pole_lon: 67.4999923706
gsi_bands: 44

static_weight: 0.2
ensemble_weight: 0.8

# MGBF localization on a rotated lon-lat filter grid (same rotation as the gsibec grid)
mgbf_init_nml: mgbf_na6km_p1936_init.nml
mgbf_nx: 1232
mgbf_ny: 1232
mgbf_x_start: -60.0310278618037
mgbf_x_end: 60.0310278618037
mgbf_y_start: -36.6574659140194
mgbf_y_end: 36.6574659140194

# Forecasting
atmosphere_forecast_length: PT6H
atmosphere_forecast_timestep: PT1H


# Observation things
# ------------------
use_error_inflation: true
mesonet_use_list_winds: true
mesonet_use_list_airTemperature: true
mesonet_use_list_specificHumidity: true
mesonet_use_list_stationPressure: true
mesonet_gsd_sfcobs_uselist: gsd_sfcobs_uselist.txt
